[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-cap"
version = "0.1.0"
description = "Task-scoped, single-generation capabilities for authenticated AI agents"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography>=44,<47"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
saga-cap = "saga.cli:main"

[tool.setuptools.packages.find]
include = ["saga*", "agent_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
